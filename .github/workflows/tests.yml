name: CI — Lint, Import & Unit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check module imports
        run: |
          python -c "from src.data import load_config, prepare_data, patient_stratified_split"
          python -c "from src.models import MajorityBaseline, LogisticBaseline"
          python -c "from src.evaluate import compute_metrics, evaluate_study_level"
          python -c "from src.train import run_baselines"
          echo "All imports OK"

      - name: Run unit tests
        run: |
          pytest -v tests/
