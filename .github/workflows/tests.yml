name: CI — Lint and Import Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "from src.data import load_config, prepare_data"
          python -c "from src.models import MajorityBaseline, LogisticBaseline"
          python -c "from src.evaluate import compute_metrics"
          echo "All imports OK"
