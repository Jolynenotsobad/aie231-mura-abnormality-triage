# ──────────────────────────────────────────────────────────────
# exp_resnet50_finetune.yaml — Fine-tuned ResNet-50 (Checkpoint 3)
# ──────────────────────────────────────────────────────────────
# Placeholder — will be populated when Model C is implemented.

data:
  root_dir: "data/MURA-v1.1"
  train_labels: "train_labeled_studies.csv"
  valid_labels: "valid_labeled_studies.csv"
  train_image_paths: "train_image_paths.csv"
  valid_image_paths: "valid_image_paths.csv"

image:
  target_size: [224, 224]
  color_mode: "rgb"
  rescale: 0.00392156862745098

split:
  val_fraction: 0.15
  test_fraction: 0.15
  random_seed: 42
  stratify: true
  group_by_patient: true

imbalance:
  use_class_weights: true

augmentation:
  enabled: true
  rotation_range: 20
  horizontal_flip: true
  width_shift_range: 0.1
  height_shift_range: 0.1
  zoom_range: 0.1
  fill_mode: "nearest"

training:
  batch_size: 32
  epochs: 30
  optimizer: "adam"
  learning_rate: 0.00001      # small LR for fine-tuning
  early_stopping:
    monitor: "val_loss"
    patience: 7
    restore_best_weights: true

model:
  name: "resnet50_finetune"
  freeze_base: false
  unfreeze_from: "conv5_block1_1_conv"   # unfreeze last residual block

seed: 42
